<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>7HE H0LY R3UP — Guide</title>
<meta name="description" content="You survived. Now we rebuild. A guide to GitHub, SEO, people, and posting, pointed back to the OG." />
<style>
  :root{
    --turq:#2fa6a0; --turq-d:#1f7f7a; --gold:#f0b35a; --peach:#f6c9a8;
    --pink:#d6598f; --purple:#7a4c9e; --denim:#4a6486; --ivory:#fdf8ee; --ink:#2b2430;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ivory);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;height:100%;display:flex;flex-direction:column}
  header{padding:14px 16px;background:linear-gradient(135deg,var(--turq),var(--purple) 70%,var(--pink));color:#fff}
  header h1{margin:0;font-size:20px;letter-spacing:2px}
  header p{margin:2px 0 0;font-size:14px;opacity:.95}
  #log{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap}
  .bot{background:#fff;border:1px solid #e6dcc8;align-self:flex-start;border-top-left-radius:4px}
  .me{background:var(--turq-d);color:#fff;align-self:flex-end;border-top-right-radius:4px}
  .msg h2{margin:0 0 6px;font-size:16px;color:var(--purple)}
  .msg p{margin:0 0 8px}
  .step,.verify{margin:8px 0 0;padding:8px 10px;border-radius:10px;font-size:15px}
  .step{background:#fff3dc;border-left:4px solid var(--gold)}
  .verify{background:#eef6f6;border-left:4px solid var(--turq)}
  .crisis{border:2px solid var(--pink)}
  #chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 8px}
  .chip{border:1px solid var(--turq-d);background:#fff;color:var(--turq-d);padding:8px 12px;border-radius:999px;
    font-size:15px;cursor:pointer}
  .chip:hover,.chip:focus{background:var(--turq-d);color:#fff;outline:none}
  form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #e6dcc8;background:#fff}
  input{flex:1;padding:12px;border:1px solid #cdbfa5;border-radius:12px;font-size:17px;background:var(--ivory)}
  button.send{padding:0 18px;border:0;border-radius:12px;background:var(--gold);color:var(--ink);font-weight:700;font-size:16px;cursor:pointer}
  footer{font-size:12px;color:#6b6272;padding:6px 12px 10px;text-align:center;background:#fff}
  a{color:var(--denim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>7HE H0LY R3UP</h1>
    <p>You survived. Now we rebuild.</p>
  </header>
  <div id="log" role="log" aria-live="polite"></div>
  <div id="chips"></div>
  <form id="f" autocomplete="off">
    <input id="q" placeholder="Ask about GitHub, SEO, posting, God…" aria-label="Your question" />
    <button class="send" type="submit">Send</button>
  </form>
  <footer>
    Check both sides, including mine. Read the sources. Truth can withstand honest questions.<br />
    This guide is not therapy, medical, legal or financial advice, and it doesn't replace clergy.
  </footer>
</div>
<script src="testimony.js"></script>
<script src="kb.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  var log = document.getElementById("log"), chips = document.getElementById("chips");
  var form = document.getElementById("f"), input = document.getElementById("q");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;   // textContent only: no HTML injection
    return e;
  }
  function add(node) { log.appendChild(node); log.scrollTop = log.scrollHeight; }
  function userMsg(t) { add(el("div", "msg me", t)); }

  function botMsg(entry, paras, extraCls) {
    var m = el("div", "msg bot" + (extraCls ? " " + extraCls : ""));
    if (entry && entry.title) m.appendChild(el("h2", null, entry.title));
    paras.forEach(function (p) { m.appendChild(el("p", null, p)); });
    if (entry && entry.step) m.appendChild(el("div", "step", "Your 10-minute step: " + entry.step));
    if (entry && entry.verify) m.appendChild(el("div", "verify", "Check it yourself: " + entry.verify));
    add(m);
  }

  function testimonyParas() {
    var t = window.TESTIMONY || {}, out = [];
    [["Where she was", t.before], ["The turning point", t.turningPoint],
     ["What has changed", t.after], ["Big Boy", t.bigBoy]].forEach(function (p) {
      if (p[1] && p[1].trim()) out.push(p[0] + ": " + p[1].trim());
    });
    if (!out.length) {
      out.push("Nikki hasn't added her testimony here yet, and I won't make one up. When she does, it will show up right here, in her own words.");
    }
    if (t.goals && t.goals.length) out.push("Her goal: " + t.goals.join(" "));
    return out;
  }

  function respond(q) {
    var r = Engine.answer(q, window.KB, window.CRISIS_KEYS);
    if (r.crisis) return botMsg({ title: "Please hear this first" }, window.CRISIS_TEXT, "crisis");
    if (!r.entry) {
      return botMsg({ title: "I didn't catch that" },
        ["I'm a small guide, and I'd rather say so than guess. Try one of the buttons, or ask about GitHub, SEO, posting, making money honestly, the Ethiopian canon, or who the OG is."]);
    }
    var e = r.entry;
    botMsg(e, e.id === "testimony" ? testimonyParas() : e.body);
  }

  function ask(q) { q = q.trim(); if (!q) return; userMsg(q); respond(q); }

  window.CHIPS.forEach(function (c) {
    var b = el("button", "chip", c); b.type = "button";
    b.addEventListener("click", function () { ask(c); });
    chips.appendChild(b);
  });
  form.addEventListener("submit", function (ev) { ev.preventDefault(); ask(input.value); input.value = ""; });

  respond("hello");
})();
</script>
</body>
</html>
