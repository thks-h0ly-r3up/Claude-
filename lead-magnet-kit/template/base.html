<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>{{TITLE}} — 7HE H0LY R3UP</title>
<meta name="description" content="{{SUBTITLE}}" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Libre+Franklin:wght@400;500;600;700;800&display=swap');
  :root{
    --primary:{{C_PRIMARY}}; --accent:{{C_ACCENT}}; --third:{{C_THIRD}}; --denim:#4a6486;
    --cream:#fdfaf5; --ink:#2b2430; --line:#c9bfd6; --tint:{{C_TINT}};
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#e9e2ee;font-family:'Libre Franklin',Arial,sans-serif;color:var(--ink)}
  @page{size:8.5in 11in;margin:0}
  .page{width:8.5in;height:11in;margin:.25in auto;background:var(--cream);padding:.45in .6in .3in;box-shadow:0 4px 18px rgba(0,0,0,.18);position:relative;border:{{BORDER}};overflow:hidden;page-break-after:always;display:flex;flex-direction:column}
  @media print{html,body{background:none}.page{margin:0;box-shadow:none}}
  .band{height:7px;width:100%;background:linear-gradient(90deg,var(--primary),var(--accent) 45%,var(--third));border-radius:4px;margin-bottom:12px;flex:none}
  .brand{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--accent);text-transform:uppercase;text-align:center}
  h1{font-family:'Caveat',cursive;font-size:58px;line-height:1;margin:6px 0;color:var(--primary);text-align:center}
  h2{font-family:'Caveat',cursive;font-size:36px;line-height:1.05;margin:4px 0 8px;color:var(--primary)}
  h3{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin:12px 0 5px;font-weight:800}
  p,li{font-size:13.5px;line-height:1.5} ul,ol{margin:4px 0 4px 20px;padding:0}
  .subtitle{font-size:14px;font-weight:600;color:var(--denim);text-transform:uppercase;letter-spacing:1px;text-align:center}
  .orn{text-align:center;font-size:64px;margin:14px 0}
  .cover-photo{width:100%;height:4.4in;object-fit:cover;border-radius:12px;border:3px solid var(--primary);margin-top:12px}
  .verse{background:var(--tint);border-left:5px solid var(--primary);border-radius:8px;padding:9px 14px;font-style:italic;margin:8px 0}
  .verse b{font-style:normal;display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
  .tool{border:2.5px solid var(--primary);border-radius:12px;padding:10px 14px;background:#fff;margin:8px 0;position:relative}
  .tool .tag{position:absolute;top:-11px;left:14px;background:var(--primary);color:#fff;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:3px 10px;border-radius:14px}
  .row{display:flex;gap:8px;align-items:flex-end;margin:7px 0}
  .box{width:15px;height:15px;border:2px solid var(--ink);border-radius:3px;flex:none}
  .line{flex:1;border-bottom:1.5px solid var(--line);height:20px}
  .crisis{margin-top:auto;font-size:10.5px;background:#f6f0fa;border:1.5px dashed var(--accent);border-radius:8px;padding:5px 10px;line-height:1.35}
  footer{flex:none;text-align:center;font-size:9px;color:#6b6175;border-top:1.5px solid var(--line);padding-top:5px;margin-top:8px}
  footer .mission{font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);font-size:10px}
  footer .legal{font-size:7.5px;line-height:1.25;margin-top:2px}
  .testimony p{font-size:14px} .sig{font-family:'Caveat',cursive;font-size:26px;color:var(--primary)}
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .gallery img{width:100%;height:2.0in;object-fit:cover;object-position:50% 22%;border-radius:10px;border:2px solid var(--accent)}
  .legal-page p,.legal-page li{font-size:9.6px;line-height:1.35;margin:3px 0} .legal-page h2{font-size:28px}
  .cta{text-align:center;background:var(--primary);color:#fff;border-radius:12px;padding:12px;margin:10px 0;font-weight:800}
  .cta a{color:#fff}
  a{color:var(--accent)}
  .nb{width:100%;border-collapse:collapse;margin:8px 0;font-size:12.5px}
  .nb th{background:var(--primary);color:#fff;text-align:left;padding:5px 8px;font-size:11px;letter-spacing:1px;text-transform:uppercase}
  .nb td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;background:#fff;line-height:1.35}
  .cal{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:8px 0}
  .cal div{border:1.5px solid var(--line);background:#fff;border-radius:6px;height:.62in;font-size:10px;padding:3px 5px;font-weight:700;color:var(--accent)}
  .card2{border:2px solid var(--accent);border-radius:12px;padding:8px 12px;margin:7px 0;background:#fff}
  .card2 b.h{color:var(--primary);font-size:13.5px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cards .v{border:2px dashed var(--accent);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.35;background:#fff}
  .cards .v b{display:block;color:var(--primary);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;margin-top:4px}
  .lg{font-size:15px}
  .lbl{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:9px;padding:1px 8px;margin-right:6px;vertical-align:1px}
  .lbl.s{background:var(--primary)} .lbl.m{background:var(--denim)} .lbl.a{background:var(--third)}
  .decl{background:var(--tint);border-radius:10px;padding:8px 14px;margin:8px 0;font-weight:700;font-size:13px}
  .decl div{margin:3px 0}
  .lens{font-size:11px;color:var(--denim);margin:4px 0}
  .lens b{color:var(--accent)}
  .cert{border:7px double var(--primary);flex:1;margin:10px 0 6px;padding:26px 40px;text-align:center;display:flex;flex-direction:column;justify-content:center;background:#fff;border-radius:6px}
  .cert h1{font-size:54px} .cert .nm{border-bottom:2px solid var(--ink);margin:22px 40px 4px;height:34px}
  .cert .cap{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--denim)}
  .cert .sg{display:flex;gap:40px;margin-top:28px} .cert .sg div{flex:1;border-top:2px solid var(--ink);padding-top:4px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--denim)}
  .toc{width:100%;border-collapse:collapse} .toc td{padding:7px 4px;border-bottom:1px dotted var(--line);font-size:14px} .toc td:last-child{text-align:right;font-weight:800;color:var(--accent);width:.6in}
</style>
</head>
<body>
{{PAGES}}
</body>
</html>
